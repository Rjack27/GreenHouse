<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Step Response PID</title>
  <link rel="stylesheet" href="monitoring.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <h2>Step Response PID</h2>
  <div class="container">
    <div class="chart-wrapper">
      <canvas id="stepResponseChart"></canvas>
    </div>
    <div id="infoPanel">
      <p><strong>PPM:</strong> <span id="ppmValue">-</span></p>
      <p><strong>PWM:</strong> <span id="pwmValue">-</span></p>
      <p><strong>Suhu:</strong> <span id="suhuValue">-</span> °C</p>
      <p><strong>Setpoint:</strong> <span id="setpointValue">-</span> ppm</p>
      <p><strong>pH:</strong> <span id="phValue">-</span></p>
      <p><strong>Ketinggian Air:</strong> <span id="tinggiAirValue">-</span> cm</p>
    </div>
  </div>

  <script type="module" src="monitoring.js"></script>
</body>
</html>
